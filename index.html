 /* =========================================
   AMBIENT BLUE BLOBS
   ========================================= */

.ambient-blobs {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.55;
  animation: blobFloat 16s ease-in-out infinite;
  will-change: transform;
}

/* TOP */
.blob-1 {
  width: 420px;
  height: 420px;
  top: -120px;
  left: -100px;
  background: rgba(30, 100, 220, 0.55);
}

/* UPPER RIGHT */
.blob-2 {

  height: 360px;

  animation-delay: -4s;
}

/* MIDDLE LEFT */
.blob-3 {

  height: 480px;
  top: 32%;
  left: -180px;
  background: rgba(25, 70, 180, 0.48);
  animation-delay: -8s;
}

/* CENTER RIGHT */
.blob-4 {
  width: 430px;
  height: 430px;
  top: 47%;
  right: -150px;
  background: rgba(0, 140, 230, 0.48);
  animation-delay: -11s;
}

/* LOWER LEFT */
.blob-5 {

  height: 390px;

}


/* =========================================
   FLOATING ANIMATION
   ========================================= */

@keyframes blobFloat {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  25% {
    transform: translate3d(35px, -25px, 0) scale(1.05);
  }

  50% {

  }

  75% {

  }

  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}


/* =========================================
   MOBILE

  }
}
